# 用例设计模板。复制为 scenarios/<模块>/<功能>/用例设计.yaml 填写，再用 ifc design <模块>/<功能> 生成给业务人员看的 HTML 页面。
# 全部用业务话。不出现表单 ID、组件名、字段的技术名、数据库表名、选择器、脚本。
# 这份文件业务人员确认之后才开始做自动化。它不会被引擎执行。
# 怎么选用例见 references/选用例.md；模块和共同机制见 references/产品与模块.md。下面的内容只是示例写法，不是要照抄的清单。
module: LM                      # 模块代号
feature: 企业授信额度申请         # 功能名称
menu: 企业业务 > 企业授信 > 企业授信额度申请        # 功能入口（菜单路径）
roles:                          # 谁来用，各自做什么
  制单人: 填单、保存、提交
  审核人: 在公司审核、公司复核两个节点审批
flow: 制单提交 → 公司审核 → 公司复核 → 办结          # 审批怎么走
env: 开发测试环境；制单账号 0001、审核账号 0002       # 用哪个环境、哪些账号。不写口令

chain:                          # 这个功能在业务链上的位置
  object: 一笔企业授信额度
  upstream: 授信品种已维护并被选用；成员单位已存在
  downstream: 办结后额度生效，贷款合同、外汇交易可以占用它；之后可以做额度变更、冻结、终止
  mechanisms: [申请和结果分开, 单据状态]              # 涉及 产品与模块.md 里的哪几条共同机制

rules:                          # 业务规则。每条必须有依据；依据只能是用户给的资料、知识库、系统配置、真实页面、产品代码
  - id: R1
    rule: 生效日期、到期日期、授信期限三者联动：填了其中两个，系统算出第三个
    source: 产品知识库《企业授信额度申请》
    verified: 页面上三个字段都在；联动要试跑才能确认      # 在真实页面上核实了吗（ifc view 看到了什么）
  - id: R2
    rule: 授信编号由系统自动生成，制单人不能填
    source: 真实页面
    verified: 已核实：该字段显示"系统自动生成"且不可填
  - id: R3
    rule: 审批完成之前，额度不生效，授信额度查询里查不到
    source: 产品知识库《信贷单据三层数据模型》
    verified: 要试跑才能确认

cases:
  - title: 单品种授信额度申请，两级审批后办结，额度生效
    kind: 主流程                # 主流程 / 核心异常
    form: 单一授信品种，12 个月   # 业务形态：生产中常见的一种业务情况
    object_from: 本用例新建      # 要处理的对象从哪里来（新建，或由哪条上游用例做出来）
    goal: 保证最常见的授信申请能完整走通，且办结后业务结果正确
    preconditions:
      - 成员单位"某某公司"存在
    data:                       # 测试数据要具体；下拉选项用 ifc view --options 看到的真实值
      申请人: 某某公司
      授信品种: 流动资金贷款
      授信金额: HKD 100,000
      授信期限: 12 个月
    steps:                      # who 谁；do 做什么；expect 预期结果（从输入和规则推出来，写明用的是哪条规则）。内容里有英文逗号（如 HKD 30,000）时整段加双引号
      - {who: 制单人, do: 打开授信额度申请，选申请人，填金额、币种、生效日期和期限, expect: 到期日期由系统自动算出，等于生效日期往后 12 个月（规则 R1）}
      - {who: 制单人, do: 保存, expect: 保存成功，系统生成授信编号（规则 R2）；单据是制单状态}
      - {who: 制单人, do: 提交, expect: 单据变为审批中；授信额度查询里还查不到这一笔（规则 R3）}
      - {who: 审核人, do: 在待办里依次同意两个节点, expect: 单据办结，出现在"已完成"里}
      - {who: 制单人, do: 到授信额度查询里查这一笔, expect: 正好一笔，金额、币种、期限和申请时填的一致，状态有效}

  - title: 多品种授信额度申请，审核时退回一次，改后重提办结
    kind: 主流程
    form: 两个授信品种分别给额度；中途被退回
    object_from: 本用例新建
    goal: 保证多品种的常见情况能走通；退回后单据回到制单、额度不生效，改完再提交仍能正常办结
    preconditions:
      - 成员单位"某某公司"存在
    data:
      申请人: 某某公司
      授信品种: 流动资金贷款 HKD 60,000；外汇交易 HKD 40,000
      授信金额: HKD 100,000
      授信期限: 12 个月
    steps:
      - {who: 制单人, do: 填两个授信品种和各自额度，保存并提交, expect: 单据变为审批中}
      - {who: 审核人, do: 在公司审核节点退回, expect: 单据回到制单人待办，状态是制单；授信额度查询里查不到（规则 R3）}
      - {who: 制单人, do: "打开被退回的单据，把外汇交易额度改为 HKD 30,000、授信金额改为 HKD 90,000，保存后再提交", expect: 沿用原授信编号，单据变为审批中}
      - {who: 审核人, do: 依次同意两个节点, expect: 单据办结}
      - {who: 制单人, do: 到授信额度查询里查这一笔, expect: "正好一笔，授信金额 HKD 90,000，两个品种分别是 HKD 60,000 和 HKD 30,000"}

not_tested:                     # 这次不测的，和原因
  - {what: 必填项没填被拦截, why: 属于表单配置，测了说明不了业务对不对}
  - {what: 共同申请人多于一个的情况, why: 不是日常场景，留给人工测}

questions:                      # 需要业务确认的问题，用业务话问。能自己查到的不要问（如下拉里有哪些选项、字段是否必填）；没有就写 []
  - 授信品种额度加起来和授信金额不一致时，业务上是否应该不让提交？
