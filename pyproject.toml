[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-ai-autotest"
dynamic = ["version"]
description = "IFC AI 自动化测试框架：业务场景即数据，在 PanUI/OSP 系统上运行并校对结果"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
ifc = "ifcat.cli:main"

[tool.setuptools]
package-dir = {"" = "core"}
packages = ["ifcat", "ifcat.adapters", "ifcat.meta"]

[tool.setuptools.package-data]
ifcat = ["MANIFEST.json"]

[tool.setuptools.dynamic]
version = {attr = "ifcat.CORE_VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
