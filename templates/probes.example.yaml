# 标定探针示例。每个项目一份，复制为 工作区的 probes/<环境>.calibration.yaml（并在 workspace.yaml 的 probes 里登记） 后按该环境的真实数据填写。
# 每条探针：在 form 这张表单里，对 label 字段填 value，再读回比较 expect（不写则与 value 相同）。
# 同一组件类型只要有一条探针失败，该类型就记为标定失败。
# 选探针字段的原则：用没有业务副作用、可重复改写的字段；下拉类的 value 必须是该环境里真实存在的选项。
probes:
  - {type: FormTextInput,     form: FORM_ID, label: 字段标签, value: "示例文本"}
  - {type: FormDateField,     form: FORM_ID, label: 字段标签, value: "2026-01-01"}
  - {type: InterestRateInput, form: FORM_ID, label: 字段标签, value: "3", expect: "3.00"}
  - {type: HelpComboBox,      form: FORM_ID, label: 字段标签, value: "该环境里存在的选项"}
  # 网格单元格：type 写 GridCell:<编辑器码>（1 文本、3 数值、5 日期、6/21 下拉；7、30 暂不支持）
  - {type: "GridCell:1", form: FORM_ID, grid: 网格key, label: 列表头, value: "示例", add_button: "增加分录"}
