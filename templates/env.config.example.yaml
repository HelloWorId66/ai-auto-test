# 环境配置示例。复制到工作区的 config/local/<环境名>.yaml 后填写；该目录不入库。
# 测试环境在内网，口令可直接写在 password 里（该目录不入库）；也可改用 password_env: 环境变量名。
project: demo
env_name: sit
product_version: ""                       # 被测产品版本，换版本必须改，否则会沿用旧标定
locale: zh-CN                             # 界面语言。菜单、按钮文字随语言变化，场景与菜单配置按此语言写
base_url: http://HOST:PORT/xxx/home.html
accounts:
  maker:   {username: "", password: ""}    # 经办/制单
  checker: {username: "", password: ""}    # 审核/复核
db:                                       # 只读账号，口令同样走环境变量
  kind: oracle
  dsn: "HOST:PORT/SERVICE"
  username: ""
  password_env: IFCAT_DB_PWD
env_params:
  forms:                                  # 表单打开方式：菜单路径（界面语言下的文字），同名项用「文字#序号」
    SOME_FORM_ID:
      menu: ["一级菜单", "二级菜单", "三级菜单"]
  ui_text:
    home_tab: "首页"
