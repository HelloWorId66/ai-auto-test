# 场景模板。业务人员审的是由本文件渲染出的 HTML 审核页（python ifc.py render 本文件）。
# 每个场景至少要有一个检查点（expect_ 开头的步骤），否则判为无效。
id: 模块代号-场景简称          # 例如 DP-存入-正常
title: 场景标题（业务语言）
module: DP
requirement: ""               # 增量需求填需求编号
goal: 这个场景要保证什么（一两句业务语言）
source:                       # 依据：需求、设计、禅道用例、实际界面观察
  - 依据来源
unconfirmed:                  # 还没有证据的内容，审核页会标红请业务确认；没有就删掉
  - 待确认的业务规则或数据
labels:                       # 技术字段名 -> 业务名称，只用于审核页和报告显示
  某组件key: 业务名称
preconditions:
  - 前提条件（业务语言，例如：存在可用的存款方、存款类型）
roles:
  maker: 制单员
  checker: 复核员
data:                         # 场景用到的业务数据，步骤里用 ${data.名字} 引用；日期用 ${today+30} 等，不重复的值用 ${unique}
  amount: "待业务确认"
steps:
  - {id: s1, as: maker, do: open, 说明: 打开某某单据, args: {form: 表单ID}}
  - {id: s2, as: maker, do: fill, 说明: 填写主要信息, args: {form: 表单ID, values: {字段标签: "${data.amount}"}}}
  - {id: s3, as: maker, do: save, 说明: 保存, args: {form: 表单ID}}
  - {id: s4, as: maker, do: capture_field, 说明: 记录单据编号, args: {form: 表单ID, label: 单据编号, name: bill_no}}
  - {id: s5, as: maker, do: submit, 说明: 提交审批, args: {form: 表单ID}}
  - {id: c1, do: expect_db_status, 说明: 单据进入审批中, args: {flow: 流程号, key: "${captured.bill_no}", state: approving}}
# 增量需求写法（单独一个文件）：
#   extends: 基线场景id
#   set: {data.amount: "200"}
#   add_steps_after: {s2: [{id: n1, do: expect_field, args: {...}}]}
#   remove_steps: [s4]
